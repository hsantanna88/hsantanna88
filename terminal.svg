<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260">
  <defs>
    <style>
      .term-bg { fill: #0a0a0a; }
      .titlebar { fill: #1a1a1a; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .prompt { fill: #00c853; }
      .comment { fill: #cccccc; }
      .title-text { fill: #888888; }
    </style>
  </defs>

  <!-- Terminal window -->
  <rect width="600" height="260" rx="8" class="term-bg"/>

  <!-- Title bar -->
  <rect width="600" height="28" rx="8" class="titlebar"/>
  <rect y="20" width="600" height="8" class="titlebar"/>

  <!-- Window dots -->
  <circle cx="18" cy="14" r="5" class="dot-red"/>
  <circle cx="36" cy="14" r="5" class="dot-yellow"/>
  <circle cx="54" cy="14" r="5" class="dot-green"/>

  <!-- Title -->
  <text x="300" y="18" font-family="monospace" font-size="12" text-anchor="middle" class="title-text">hsantanna@uab ~</text>

  <!-- Terminal content -->
  <text xml:space="preserve" x="18" y="58" font-family="monospace" font-size="15" class="prompt">$hsantanna &gt; whoami</text>
  <text xml:space="preserve" x="18" y="78" font-family="monospace" font-size="15" class="comment">Hi, I'm Hugo Sant'Anna, an Assistant Professor</text>
  <text xml:space="preserve" x="18" y="98" font-family="monospace" font-size="15" class="comment">of Economics at the University of Alabama at</text>
  <text xml:space="preserve" x="18" y="118" font-family="monospace" font-size="15" class="comment">Birmingham. Go Blazers!</text>

  <text xml:space="preserve" x="18" y="158" font-family="monospace" font-size="15" class="prompt">$hsantanna &gt; research</text>
  <text xml:space="preserve" x="18" y="178" font-family="monospace" font-size="15" class="comment">I work with large-scale matched employer-employee</text>
  <text xml:space="preserve" x="18" y="198" font-family="monospace" font-size="15" class="comment">data, focusing on labor economics and applied and</text>
  <text xml:space="preserve" x="18" y="218" font-family="monospace" font-size="15" class="comment">theoretical econometrics. Currently studying how</text>
  <text xml:space="preserve" x="18" y="238" font-family="monospace" font-size="15" class="comment">immigration flows reshape wage and employment equilibrium.</text>
</svg>
