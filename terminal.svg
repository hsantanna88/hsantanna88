<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190">
  <defs>
    <style>
      .term-bg { fill: #0a0a0a; }
      .titlebar { fill: #1a1a1a; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .prompt { fill: #00c853; }
      .comment { fill: #cccccc; }
      .title-text { fill: #888888; }
      .cursor-end {
        opacity: 0;
        animation: cursor-appear 0.01s 4.5s forwards, blink 1s 4.5s step-end infinite;
      }
      @keyframes cursor-appear {
        to { opacity: 1; }
      }
      @keyframes blink {
        0% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>

    <clipPath id="l1"><rect width="0" height="300"><animate attributeName="width" to="600" dur="0.25s" begin="0.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect width="0" height="300"><animate attributeName="width" to="600" dur="0.4s" begin="0.55s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect width="0" height="300"><animate attributeName="width" to="600" dur="0.4s" begin="1.05s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect width="0" height="300"><animate attributeName="width" to="600" dur="0.25s" begin="1.55s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect width="0" height="300"><animate attributeName="width" to="600" dur="0.4s" begin="2.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect width="0" height="300"><animate attributeName="width" to="600" dur="0.4s" begin="2.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect width="0" height="300"><animate attributeName="width" to="600" dur="0.5s" begin="3.1s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- Terminal window -->
  <rect width="600" height="190" rx="8" class="term-bg"/>

  <!-- Title bar -->
  <rect width="600" height="24" rx="8" class="titlebar"/>
  <rect y="16" width="600" height="8" class="titlebar"/>

  <!-- Window dots -->
  <circle cx="16" cy="12" r="4.5" class="dot-red"/>
  <circle cx="32" cy="12" r="4.5" class="dot-yellow"/>
  <circle cx="48" cy="12" r="4.5" class="dot-green"/>

  <!-- Title -->
  <text x="300" y="16" font-family="monospace" font-size="10" text-anchor="middle" class="title-text">hsantanna@uab ~</text>

  <!-- Terminal content with typing animation -->
  <text clip-path="url(#l1)" xml:space="preserve" x="16" y="42" font-family="monospace" font-size="11" class="prompt">$hsantanna &gt; whoami</text>
  <text clip-path="url(#l2)" xml:space="preserve" x="16" y="57" font-family="monospace" font-size="11" class="comment">Hi, I'm Hugo Sant'Anna, an Assistant Professor of Economics</text>
  <text clip-path="url(#l3)" xml:space="preserve" x="16" y="72" font-family="monospace" font-size="11" class="comment">at the University of Alabama at Birmingham. Go Blazers!</text>

  <text clip-path="url(#l4)" xml:space="preserve" x="16" y="97" font-family="monospace" font-size="11" class="prompt">$hsantanna &gt; research</text>
  <text clip-path="url(#l5)" xml:space="preserve" x="16" y="112" font-family="monospace" font-size="11" class="comment">I work with large-scale matched employer-employee data, focusing on</text>
  <text clip-path="url(#l6)" xml:space="preserve" x="16" y="127" font-family="monospace" font-size="11" class="comment">labor economics and applied and theoretical econometrics. Currently</text>
  <text clip-path="url(#l7)" xml:space="preserve" x="16" y="142" font-family="monospace" font-size="11" class="comment">studying how immigration flows reshape wage and employment equilibrium.</text>

  <!-- Blinking cursor after typing finishes -->
  <rect x="16" y="154" width="6" height="11" fill="#00c853" class="cursor-end"/>
</svg>
