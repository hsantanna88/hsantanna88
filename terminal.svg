<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240">
  <defs>
    <style>
      .term-bg { fill: #0a0a0a; }
      .titlebar { fill: #1a1a1a; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .prompt { fill: #00c853; }
      .comment { fill: #cccccc; }
      .title-text { fill: #888888; }
      .cursor-end {
        opacity: 0;
        animation: cursor-appear 0.01s 4.5s forwards, blink 1s 4.5s step-end infinite;
      }
      @keyframes cursor-appear {
        to { opacity: 1; }
      }
      @keyframes blink {
        0% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>

    <clipPath id="l1"><rect width="0" height="300"><animate attributeName="width" to="600" dur="0.25s" begin="0.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect width="0" height="300"><animate attributeName="width" to="600" dur="0.4s" begin="0.55s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect width="0" height="300"><animate attributeName="width" to="600" dur="0.4s" begin="1.05s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect width="0" height="300"><animate attributeName="width" to="600" dur="0.25s" begin="1.55s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect width="0" height="300"><animate attributeName="width" to="600" dur="0.25s" begin="2.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect width="0" height="300"><animate attributeName="width" to="600" dur="0.4s" begin="2.45s" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect width="0" height="300"><animate attributeName="width" to="600" dur="0.4s" begin="2.95s" fill="freeze"/></rect></clipPath>
    <clipPath id="l8"><rect width="0" height="300"><animate attributeName="width" to="600" dur="0.4s" begin="3.45s" fill="freeze"/></rect></clipPath>
    <clipPath id="l9"><rect width="0" height="300"><animate attributeName="width" to="600" dur="0.5s" begin="3.95s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- Terminal window -->
  <rect width="600" height="240" rx="8" class="term-bg"/>

  <!-- Title bar -->
  <rect width="600" height="28" rx="8" class="titlebar"/>
  <rect y="20" width="600" height="8" class="titlebar"/>

  <!-- Window dots -->
  <circle cx="18" cy="14" r="5" class="dot-red"/>
  <circle cx="36" cy="14" r="5" class="dot-yellow"/>
  <circle cx="54" cy="14" r="5" class="dot-green"/>

  <!-- Title -->
  <text x="300" y="18" font-family="monospace" font-size="11" text-anchor="middle" class="title-text">hsantanna@uab ~</text>

  <!-- Terminal content with typing animation -->
  <text clip-path="url(#l1)" xml:space="preserve" x="18" y="48" font-family="monospace" font-size="13" class="prompt">$hsantanna &gt; whoami</text>
  <text clip-path="url(#l2)" xml:space="preserve" x="18" y="66" font-family="monospace" font-size="13" class="comment">Hi, I'm Hugo Sant'Anna, an Assistant Professor</text>
  <text clip-path="url(#l3)" xml:space="preserve" x="18" y="84" font-family="monospace" font-size="13" class="comment">of Economics at the University of Alabama at</text>
  <text clip-path="url(#l4)" xml:space="preserve" x="18" y="102" font-family="monospace" font-size="13" class="comment">Birmingham. Go Blazers!</text>

  <text clip-path="url(#l5)" xml:space="preserve" x="18" y="138" font-family="monospace" font-size="13" class="prompt">$hsantanna &gt; research</text>
  <text clip-path="url(#l6)" xml:space="preserve" x="18" y="156" font-family="monospace" font-size="13" class="comment">I work with large-scale matched employer-employee</text>
  <text clip-path="url(#l7)" xml:space="preserve" x="18" y="174" font-family="monospace" font-size="13" class="comment">data, focusing on labor economics and applied and</text>
  <text clip-path="url(#l8)" xml:space="preserve" x="18" y="192" font-family="monospace" font-size="13" class="comment">theoretical econometrics. Currently studying how</text>
  <text clip-path="url(#l9)" xml:space="preserve" x="18" y="210" font-family="monospace" font-size="13" class="comment">immigration flows reshape wage and employment equilibrium.</text>

  <!-- Blinking cursor after typing finishes -->
  <rect x="18" y="222" width="7" height="13" fill="#00c853" class="cursor-end"/>
</svg>
