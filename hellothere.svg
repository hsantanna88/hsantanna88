<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 60">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .light { fill: rgb(0, 200, 83); }

      .glow {
        filter: drop-shadow(0px 0px 2px rgba(0, 200, 83, 0.5));
        animation: flicker 2s linear infinite;
      }

      @keyframes flicker {
        0%, 100% { opacity: 0.92; }
        50% { opacity: 1; }
      }

      .char { opacity: 0; }
      .c1  { animation: pop 0.01s 0.15s forwards; }
      .c2  { animation: pop 0.01s 0.30s forwards; }
      .c3  { animation: pop 0.01s 0.45s forwards; }
      .c4  { animation: pop 0.01s 0.60s forwards; }
      .c5  { animation: pop 0.01s 0.75s forwards; }
      .c6  { animation: pop 0.01s 0.90s forwards; }
      .c7  { animation: pop 0.01s 1.05s forwards; }
      .c8  { animation: pop 0.01s 1.20s forwards; }
      .c9  { animation: pop 0.01s 1.35s forwards; }
      .c10 { animation: pop 0.01s 1.50s forwards; }
      .c11 { animation: pop 0.01s 1.65s forwards; }
      .c12 { animation: pop 0.01s 1.80s forwards; }
      .c13 { animation: pop 0.01s 1.95s forwards; }

      @keyframes pop {
        to { opacity: 1; }
      }

      .cursor {
        animation:
          cursor-move 2.1s linear forwards,
          blink 1s step-end infinite;
      }

      @keyframes blink {
        0% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes cursor-move {
        0%      { transform: translateX(0px); }
        7.14%   { transform: translateX(0px); }
        7.15%   { transform: translateX(8.4px); }
        14.28%  { transform: translateX(8.4px); }
        14.29%  { transform: translateX(16.8px); }
        21.42%  { transform: translateX(16.8px); }
        21.43%  { transform: translateX(25.2px); }
        28.56%  { transform: translateX(25.2px); }
        28.57%  { transform: translateX(33.6px); }
        35.70%  { transform: translateX(33.6px); }
        35.71%  { transform: translateX(42px); }
        42.84%  { transform: translateX(42px); }
        42.85%  { transform: translateX(50.4px); }
        49.98%  { transform: translateX(50.4px); }
        49.99%  { transform: translateX(58.8px); }
        57.12%  { transform: translateX(58.8px); }
        57.13%  { transform: translateX(67.2px); }
        64.26%  { transform: translateX(67.2px); }
        64.27%  { transform: translateX(75.6px); }
        71.40%  { transform: translateX(75.6px); }
        71.41%  { transform: translateX(84px); }
        78.54%  { transform: translateX(84px); }
        78.55%  { transform: translateX(92.4px); }
        85.68%  { transform: translateX(92.4px); }
        85.69%  { transform: translateX(100.8px); }
        92.82%  { transform: translateX(100.8px); }
        92.83%  { transform: translateX(109.2px); }
        100%    { transform: translateX(109.2px); }
      }

      .scanline {
        opacity: 0.03;
        animation: scan-flicker 1s linear infinite;
      }
      @keyframes scan-flicker {
        0%, 100% { opacity: 0.03; }
        50% { opacity: 0.05; }
      }
    </style>

    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="480" height="3">
      <rect width="480" height="1" fill="rgb(0,200,83)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="480" height="60" rx="6" class="bg"/>

  <!-- Frame border -->
  <rect x="1" y="1" width="478" height="58" rx="5" fill="none" stroke="rgba(0,200,83,0.15)" stroke-width="1"/>

  <!-- Dragon emoji + typing line -->
  <text x="148" y="37" font-size="22">&#x1F409;</text>
  <text xml:space="preserve" x="175" y="37" font-family="monospace" font-size="14" class="glow light">$ <tspan class="char c1">h</tspan><tspan class="char c2">e</tspan><tspan class="char c3">l</tspan><tspan class="char c4">l</tspan><tspan class="char c5">o</tspan><tspan class="char c6"> </tspan><tspan class="char c7">t</tspan><tspan class="char c8">h</tspan><tspan class="char c9">e</tspan><tspan class="char c10">r</tspan><tspan class="char c11">e</tspan><tspan class="char c12">!</tspan></text>

  <!-- Blinking cursor -->
  <rect x="192" y="25" width="8" height="14" class="cursor light"/>

  <!-- Scanlines overlay -->
  <rect width="480" height="60" rx="6" fill="url(#scanlines)" class="scanline"/>
</svg>
