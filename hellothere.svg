<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220">
  <defs>
    <style>
      .term-bg { fill: #0a0a0a; }
      .titlebar { fill: #1a1a1a; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .prompt { fill: #00c853; }
      .comment { fill: #cccccc; }
      .title-text { fill: #888888; }

      .glow {
        fill: #00c853;
        filter: drop-shadow(0px 0px 2px rgba(0, 200, 83, 0.5));
      }

      .cursor-end {
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal window -->
  <rect width="600" height="220" rx="8" class="term-bg"/>

  <!-- Title bar -->
  <rect width="600" height="24" rx="8" class="titlebar"/>
  <rect y="16" width="600" height="8" class="titlebar"/>

  <!-- Window dots -->
  <circle cx="16" cy="12" r="4.5" class="dot-red"/>
  <circle cx="32" cy="12" r="4.5" class="dot-yellow"/>
  <circle cx="48" cy="12" r="4.5" class="dot-green"/>

  <!-- Title -->
  <text x="300" y="16" font-family="monospace" font-size="10" text-anchor="middle" class="title-text">hsantanna@uab ~</text>

  <!-- Hello line + dragon -->
  <text xml:space="preserve" x="16" y="46" font-family="monospace" font-size="11" class="prompt">$hsantanna &gt;</text>
  <text xml:space="preserve" x="118" y="46" font-family="monospace" font-size="11" class="glow">hello there!</text>
  <text x="215" y="70" font-size="45">&#x1F409;</text>

  <!-- whoami -->
  <text xml:space="preserve" x="16" y="72" font-family="monospace" font-size="11" class="prompt">$hsantanna &gt; whoami</text>
  <text xml:space="preserve" x="16" y="87" font-family="monospace" font-size="11" class="comment">Hi, I'm Hugo Sant'Anna, an Assistant Professor of Economics</text>
  <text xml:space="preserve" x="16" y="102" font-family="monospace" font-size="11" class="comment">at the University of Alabama at Birmingham. Go Blazers!</text>

  <!-- research -->
  <text xml:space="preserve" x="16" y="127" font-family="monospace" font-size="11" class="prompt">$hsantanna &gt; research</text>
  <text xml:space="preserve" x="16" y="142" font-family="monospace" font-size="11" class="comment">I work with large-scale matched employer-employee data, focusing on</text>
  <text xml:space="preserve" x="16" y="157" font-family="monospace" font-size="11" class="comment">labor economics and applied and theoretical econometrics. Currently</text>
  <text xml:space="preserve" x="16" y="172" font-family="monospace" font-size="11" class="comment">studying how immigration flows reshape wage and employment equilibrium.</text>

  <!-- Blinking cursor -->
  <rect x="16" y="184" width="6" height="11" fill="#00c853" class="cursor-end"/>
</svg>
